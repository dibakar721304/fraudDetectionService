server:
  port: 8080

spring:
  application:
    name: fraud-detection-api
  datasource:
    url: jdbc:h2:mem:frauddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  cache:
    type: simple

fraud:
  rules:
    large-transfer-threshold: 10000.00
    velocity-max-transactions: 5
    velocity-window-minutes: 10
    new-location-risk-score: 40
    large-amount-risk-score: 30
    high-velocity-risk-score: 35
    unusual-hour-risk-score: 20
    blacklisted-country-risk-score: 60
    block-threshold: 80
    review-threshold: 50

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.frauddetection: DEBUG
    org.springframework.web: INFO